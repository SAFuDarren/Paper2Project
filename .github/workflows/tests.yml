name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Runtime
        run: python -c "import platform,sys; print(platform.platform()); print(sys.version)"
      - name: Full suite (hash seed 0)
        env:
          PYTHONHASHSEED: '0'
        run: python -m unittest discover -s tests -v
      - name: Full suite (hash seed 37)
        env:
          PYTHONHASHSEED: '37'
        run: python -m unittest discover -s tests -v
      - name: Reproducible README illustrations
        run: |
          python scripts/render_readme_graph.py
          git diff --exit-code -- README.md README.zh-CN.md assets/readme
      - name: Compile scripts
        run: python -m compileall -q scripts
      - name: Package checks
        run: python scripts/package_check.py
